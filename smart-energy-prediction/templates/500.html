<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Internal Server Error | EnerSense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .error-card {
            background: var(--bg-card, #ffffff);
            border: 1px solid var(--border-color, #e2e8f0);
            border-radius: var(--radius-xl, 24px);
            padding: 3rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-lg, 0 10px 25px -5px rgba(0,0,0,0.1));
        }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 5rem;
            font-weight: 800;
            color: var(--danger, #ef4444);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-primary, #f0fdf9); padding: 1.5rem;">
    <div class="error-card animate-in">
        <div class="mb-3">
            <span class="badge rounded-circle p-3" style="background: rgba(239, 68, 68, 0.12); color: var(--danger, #ef4444); font-size: 1.75rem;">
                <i class="fas fa-triangle-exclamation"></i>
            </span>
        </div>
        <div class="error-code">500</div>
        <h2 style="font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 0.75rem;">Grid Anomaly Detected</h2>
        <p style="color: var(--text-secondary, #475569); font-size: 0.95rem; margin-bottom: 2rem;">
            An unexpected error occurred while processing your energy telemetry. Our automated monitoring is on it. Please try again or head back to safety.
        </p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-accent px-4 py-2">
                <i class="fas fa-home me-2"></i> Return Home
            </a>
            <a href="javascript:history.back()" class="btn btn-glass px-4 py-2">
                <i class="fas fa-arrow-left me-2"></i> Go Back
            </a>
        </div>
    </div>
</body>
</html>
