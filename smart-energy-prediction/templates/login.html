{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-in">
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <h2 class="auth-title">Welcome to EnerSense</h2>
            <p style="font-size: 0.88rem; color: var(--text-secondary);">Sign in to your smart energy dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-accent w-100 py-2 mt-1">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In
            </button>
        </form>

        <!-- Demo Accounts Callout -->
        <div class="demo-hint-card mt-3" style="background: rgba(16, 185, 129, 0.08); border: 1px dashed var(--accent, #10b981); border-radius: 12px; padding: 12px 14px; font-size: 0.82rem;">
            <div class="d-flex align-items-center gap-2 mb-1 fw-bold color-accent">
                <i class="fas fa-key"></i> Quick Demo Access
            </div>
            <div class="d-flex justify-content-between align-items-center py-1 border-bottom border-light">
                <span><strong>Admin:</strong> admin@energy.ai</span>
                <code class="text-muted">admin123</code>
            </div>
            <div class="d-flex justify-content-between align-items-center pt-1">
                <span><strong>User:</strong> student@energy.ai</span>
                <code class="text-muted">energy123</code>
            </div>
        </div>

        <div class="text-center mt-3" style="font-size: 0.85rem;">
            <span class="text-secondary">Don't have an account?</span>
            <a href="{{ url_for('register') }}" class="color-accent fw-bold text-decoration-none"> Register</a>
        </div>
    </div>
</div>
{% endblock %}
