{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card animate-in">
        <div class="auth-logo">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <h2 class="auth-title">Join EnerSense</h2>
            <p style="font-size: 0.88rem; color: var(--text-secondary);">Start monitoring and optimizing your energy footprint</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="form-label" for="name">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Your Full Name" value="{{ name or '' }}" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="{{ email or '' }}" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm_password">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-shield-halved"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type your password" minlength="6" required>
                </div>
            </div>
            <button type="submit" class="btn btn-accent w-100 py-2 mt-2">
                <i class="fas fa-user-plus me-2"></i> Create Account
            </button>
        </form>

        <div class="text-center mt-3" style="font-size: 0.85rem;">
            <span class="text-secondary">Already have an EnerSense account?</span>
            <a href="{{ url_for('login') }}" class="color-accent fw-bold text-decoration-none"> Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
