{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="page-container" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="text-center">
        <div style="font-size: 5rem; font-weight: 800; font-family: 'Outfit'; color: var(--text-muted); opacity: 0.3;">404</div>
        <h2 class="fw-bold mb-2">Page Not Found</h2>
        <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto;">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="mt-3 d-flex gap-2 justify-content-center">
            <a href="{{ url_for('index') }}" class="btn btn-accent"><i class="fas fa-home me-2"></i> Go Home</a>
            <a href="{{ url_for('dashboard_page') }}" class="btn btn-glass"><i class="fas fa-th-large me-2"></i> Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
